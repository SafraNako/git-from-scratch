[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-from-scratch"
version = "0.2.0"
description = "A Git client written from scratch in pure Python: blob/tree/commit/tag objects, loose and packed object stores, the index, refs and init/add/commit/log/diff/branch/checkout/merge, validated byte for byte against real git"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SafraNako" }]
keywords = ["git", "version-control", "packfile", "index", "diff", "merge", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SafraNako/git-from-scratch"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
kgit = "kendi_git.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
