name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # real git (preinstalled on the runner) is the oracle of most tests: every component is compared with it, never with a mock
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show the oracle
        run: git --version

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Run the validation battery
        run: kgit dogrulama --quick
